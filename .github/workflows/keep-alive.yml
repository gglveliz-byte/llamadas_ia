name: Keep Alive Render (Ecuador 6am - 6pm)

on:
  schedule:
    # Cron en UTC. Ecuador es UTC-5.
    # 6:00 AM Ecuador = 11:00 AM UTC. 6:00 PM Ecuador = 23:00 PM UTC.
    # Corre cada 10 minutos (para evitar el límite de 15 min de Render) entre las 11:00 y las 22:59 UTC.
    - cron: "*/10 11-22 * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: curl -sSf https://vozia-backend-eezl.onrender.com/health || echo "El backend no respondió correctamente, pero la petición fue enviada."
        
      - name: Ping Frontend
        run: curl -sSf https://vozia-frontend.onrender.com || echo "El frontend no respondió correctamente, pero la petición fue enviada."
